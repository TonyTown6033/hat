[package]
name = "hat"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "client"
path = "./src/client.rs"

[[bin]]
name = "server"
path = "./src/server.rs"

[dependencies]
crossterm = "0.29.0"
getrandom = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
